[project]
name = "roborock-local-server"
version = "1.2.1"
description = "private local Roborock server stack."
requires-python = ">=3.11,<3.14"
readme = "README.md"
authors = [{ name = "Luke Lashley" }]
dependencies = [
  "aiohttp>=3.14.4,<4",
  "cryptography>=50.0.2,<51",
  "fastapi>=0.115,<1",
  "starlette>=1.3.1,<2",
  "anyio>=4.14.2,<5",
  "idna>=3.15,<4",
  "certifi>=2026.10.18",
  "multidict>=6.9.1,<7",
  "gmpy2>=2.3,<3",
  "Pillow>=13,<14",
  "pycryptodome>=3.20,<4",
  "python-roborock==4.20.0",
  "python-multipart>=0.0.32,<0.1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mkdocs>=1.6,<2",
  "mkdocs-material>=9.6,<10",
  "pytest>=9.0.3,<10",
]

[project.scripts]
roborock-local-server = "roborock_local_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/roborock_local_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
