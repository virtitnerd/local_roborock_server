server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name api-roborock.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;
        set $upstream_app roborock-local-server;
        set $upstream_port 555;
        # The backend runs listener_mode = "local_tls" and presents a real
        # cert (see README.md in this folder), so this proxies to it as a
        # normal HTTPS upstream - not plain HTTP, and no stream module needed.
        set $upstream_proto https;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;
    }
}
